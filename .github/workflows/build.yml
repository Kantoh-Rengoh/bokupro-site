# セーブデータ（saves/*.tfosave）がアップロードされたら、
# 解析・予測を実行して docs/players.json を更新し、自動でコミットする。
name: セーブデータからサイトを更新

on:
  push:
    paths:
      - "saves/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:   # GitHubの Actions タブから手動でも実行できる

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 必要な部品を入れる
        run: pip install -r requirements.txt

      - name: 解析・予測を実行（docs/players.json を作る）
        run: python scripts/build.py

      - name: 結果をコミットして送り返す
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs saves
          if git diff --cached --quiet; then
            echo "変更なし（前回と同じ結果）"
          else
            git commit -m "セーブデータからサイトを更新 [skip ci]"
            git push
          fi
